[project]
name = "pyrail"
dynamic = ["version"]
description = "A Python wrapper for the iRail API"
authors = [{name = "Jorim Tielemans", email = "tielemans.jorim@gmail.com"}]
license = "Apache-2.0"
readme = "README.md"
keywords = ["irail", "nmbs"]
classifiers = [
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.4",
    "mashumaro[orjson]>=3.23",
]

[project.urls]
Homepage = "https://github.com/tjorim/pyrail"
Repository = "https://github.com/tjorim/pyrail"
Documentation = "https://github.com/tjorim/pyrail"
Issues = "https://github.com/tjorim/pyrail/issues"
Changelog = "https://github.com/tjorim/pyrail/releases"

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "coverage[toml]>=7.16.2",
]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",
    "COM812",
    "CPY001",
    "D",
    "E501",
    "ISC001",
    "PLR0913",
    "PLR0917",
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ARG001",
    "ARG005",
    "INP001",
    "PLR2004",
    "S101",
    "SLF001",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: smoke tests against the real iRail API, excluded from ordinary runs (run with 'pytest -m live')",
]
addopts = "-ra -m 'not live' --strict-markers --strict-config"
filterwarnings = [
    "error",
]

[tool.coverage.run]
branch = true
source = ["pyrail"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 92

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.targets.sdist]
include = ["/pyrail", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["pyrail"]

[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs"]
build-backend = "hatchling.build"
