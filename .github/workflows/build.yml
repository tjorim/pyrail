name: Build Package

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: 3.12

    - name: Build the package
      run: uv build

    - name: Install the built wheel into a fresh environment
      run: |
        uv venv wheel-check
        uv pip install --python wheel-check/bin/python dist/*.whl

    - name: Import the package from the wheel
      run: wheel-check/bin/python -I -c "import pyrail; assert pyrail.IRail and pyrail.LiveboardApiResponse"

    - name: Check that py.typed ships in the wheel
      run: wheel-check/bin/python -I -c "import pathlib, pyrail; assert (pathlib.Path(pyrail.__file__).parent / 'py.typed').is_file()"
