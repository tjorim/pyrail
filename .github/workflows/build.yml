name: Build Package

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: 3.12

    - name: Build the package
      run: uv build
