name: Lint and Type Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: 3.12
        enable-cache: true

    - name: Run Ruff
      run: uv run --locked ruff check .

    - name: Run ty
      run: uv run --locked ty check .
