name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # hatch-vcs derives the release version from git history and tags.

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: 3.12

    - name: Build the package
      run: uv build

    - name: Attest built distributions
      uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027

    - name: Publish package to PyPI
      run: uv publish --trusted-publishing always
