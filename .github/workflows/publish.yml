name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish (for example v0.6.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
        fetch-depth: 0  # hatch-vcs derives the release version from git history and tags.

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: 3.12

    - name: Build the package
      run: uv build

    - name: Publish package to PyPI
      run: uv publish --trusted-publishing always
