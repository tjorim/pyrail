name: Live API Smoke Tests

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: 3.12
        enable-cache: true

    - name: Run live smoke tests
      run: uv run --locked pytest -m live
