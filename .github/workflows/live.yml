name: Live API Smoke Tests

# Calls the real iRail API to catch upstream changes the offline fixtures cannot detect.
# Deliberately not run on push or pull_request, so ordinary CI stays offline.
# A failed run notifies the maintainers through the usual GitHub Actions notifications.
on:
  schedule:
    - cron: "17 6 * * *"  # daily, off the hour to avoid the scheduler's busiest minutes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.12

    - name: Install dependencies
      run: |
        pip install poetry
        poetry install

    - name: Run live smoke tests
      run: poetry run pytest -m live
